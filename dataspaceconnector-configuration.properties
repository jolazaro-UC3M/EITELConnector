# Optional EDC runtime config file to avoid startup warning when file is missing.
# Runtime values are primarily injected via environment variables in docker-compose.

# Disable token signer/verifier (no vault in TCK/PoC environment)
edc.transfer.proxy.token.signer.privatekey.alias=none
edc.transfer.proxy.token.verifier.publickey.alias=none

# DSP protocol base path for v0.17.0 with dsp-2025 module (default is /api/protocol)
edc.web.http.protocol.path=/api/protocol

# Enable DSP HTTP protocol dispatcher and handlers
edc.protocol.dsp.http.enabled=true
edc.dsp.protocol.enabled=true

# Additional DSP configuration properties for EDC v0.16.0
# These help ensure the DSP dispatcher is properly loaded and registered
edc.service.http.client.cache.size=0
org.eclipse.edc.iam.did.parser.embedded.key=false
edc.web.rest.cors.enabled=true