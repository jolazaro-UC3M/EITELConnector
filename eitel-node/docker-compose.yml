version: "3.9"

services:
  # Handshake service: dual-VC trust gate and session token issuer
  handshake:
    build: ./handshake
    container_name: eitel-node-handshake
    ports:
      - "8080:8080"
    environment:
      - EITEL_NODE_COORDINATOR_PUBKEY_JWK_PATH=/keys/coordinator_pubkey.jwk
      - EITEL_NODE_NODE_IDENTITY_DIR=/identity
      - EITEL_NODE_EDC_MANAGEMENT_URL=${EITEL_NODE_EDC_MANAGEMENT_URL:-http://edc-control:8182}
      - EITEL_NODE_EDC_API_KEY=${EITEL_NODE_EDC_API_KEY:-change-me}
      - EITEL_NODE_EDC_DSP_ENDPOINT=${EITEL_NODE_EDC_DSP_ENDPOINT:-http://localhost:11003/api/v1/dsp}
      - EITEL_NODE_SESSION_TOKEN_TTL=${EITEL_NODE_SESSION_TOKEN_TTL:-3600}
      - EITEL_NODE_SESSION_TOKEN_SECRET=${EITEL_NODE_SESSION_TOKEN_SECRET}
    volumes:
      - ./keys:/keys:ro
      - node_identity:/identity
    networks:
      - eitel-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # copyparty: P2P file store backend for data transfer
  copyparty:
    image: copyparty/copyparty:latest
    container_name: eitel-node-copyparty
    ports:
      - "3923:3923"
    volumes:
      - copyparty_data:/data
    networks:
      - eitel-internal
    # WebRTC P2P enabled (--e2d), no authentication
    # Authentication handled by handshake layer via session tokens
    command: ["--e2d", "--no-auth", "/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3923/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  eitel-internal:
    driver: bridge
    # For PoC: internal false allows external access for testing
    # Production: set internal: true to restrict access to handshake only
    internal: false

volumes:
  node_identity:
    # Persists node's did:key and keypair across container restarts
  copyparty_data:
    # Persists uploaded/shared files

# ============================================================================
# IMPORTANT: EDC Integration
# ============================================================================
#
# This compose stack does NOT define EDC services. The handshake service
# connects to an external EDC instance via EDC_MANAGEMENT_URL.
#
# Option A: Include caas/ services (recommended for PoC on same machine)
# --------
# Add to this file:
#
#   include:
#     - ../caas/docker-compose.caas.yaml
#
# Then set environment:
#   EITEL_NODE_EDC_MANAGEMENT_URL=http://eitel-caas-control-plane:8081
#
# This brings caas/ services into the same Docker network (edc-net from caas/)
#
# Option B: External EDC (current default)
# --------
# Set EITEL_NODE_EDC_MANAGEMENT_URL to point to an external EDC deployment:
#   export EITEL_NODE_EDC_MANAGEMENT_URL=https://production-edc.example.com:8182
#
# Then run:
#   docker compose up
#
# The handshake service will connect to the external EDC.
#
# ============================================================================
