name: eitel-producer

services:
  handshake:
    build: ./handshake
    container_name: eitel-node-handshake-producer
    ports:
      - "8080:8080"
    environment:
      - EITEL_NODE_EDC_MANAGEMENT_URL=http://edc-producer-control:11002/api/management
      - EITEL_NODE_EDC_API_KEY=${EITEL_NODE_EDC_API_KEY:-poc-api-key}
      - EITEL_NODE_EDC_DSP_ENDPOINT=http://edc-producer-control:11003/api/v1/dsp/2025-1
      - EITEL_NODE_SESSION_TOKEN_TTL=${EITEL_NODE_SESSION_TOKEN_TTL:-3600}
      - EITEL_NODE_SESSION_TOKEN_SECRET=poc-secret-node-P-change-me
      - EITEL_NODE_COORDINATOR_PUBKEY_JWK_PATH=/keys/coordinator_pubkey.jwk
      - EITEL_NODE_NODE_IDENTITY_DIR=/identity
      - COPYPARTY_URL=http://copyparty:3923
      - COPYPARTY_USER=eitel
      - COPYPARTY_PASSWORD=${COPYPARTY_PASSWORD:-changeme}
    volumes:
      - ./keys:/keys:ro
      - ./identity/producer:/identity:rw
    networks:
      - eitel-producer
      - eitel-shared
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  edc-control:
    image: eitel/eclipse-edc-runtime:0.16.0
    container_name: eitel-node-edc-producer
    ports:
      - "11000:11000"
      - "11002:11002"
      - "11003:11003"
    environment:
      - EDC_PARTICIPANT_ID=producer-connector
      - WEB_HTTP_MANAGEMENT_PORT=11002
      - WEB_HTTP_MANAGEMENT_PATH=/api/management
      - WEB_HTTP_PROTOCOL_PORT=11003
      - WEB_HTTP_PROTOCOL_PATH=/api/v1/dsp
      - EDC_DSP_CALLBACK_ADDRESS=http://edc-producer-control:11003/api/v1/dsp/2025-1
      - EDC_JDBC_URL=jdbc:postgresql://postgres:5432/edc
      - EDC_JDBC_USER=postgres
      - EDC_JDBC_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - EDC_API_AUTH_KEY=${EDC_API_AUTH_KEY:-poc-api-key}
      - EDC_MANAGEMENT_CONTEXT_ENABLED=true
    networks:
      eitel-producer:
      eitel-shared:
          aliases:
            - edc-producer-control
    depends_on:
      - postgres
    volumes:
      - ../dataspaceconnector-configuration.properties:/opt/edc/dataspaceconnector-configuration.properties:ro
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: eitel-node-postgres-producer
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=edc
    volumes:
      - postgres_data_producer:/var/lib/postgresql/data
    networks:
      - eitel-producer
    restart: unless-stopped

  copyparty:
    image: python:3.11-slim
    container_name: eitel-node-copyparty-producer
    ports:
      - "127.0.0.1:3923:3923"
    volumes:
      - copyparty_data_producer:/data
    networks:
      - eitel-producer
    environment:
      - COPYPARTY_PASSWORD=${COPYPARTY_PASSWORD:-changeme}
    command:
      - sh
      - -c
      - "pip install -q copyparty && python3 -m copyparty -p 3923 -v /data:/files:rw,eitel -a eitel:${COPYPARTY_PASSWORD:-changeme} -e2dsa"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3923/').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  eitel-producer:
    driver: bridge
    internal: false
  eitel-shared:
    external: true
    driver: bridge

volumes:
  copyparty_data_producer:
  postgres_data_producer: