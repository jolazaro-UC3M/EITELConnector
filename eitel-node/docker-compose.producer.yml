name: eitel-producer

services:
  handshake:
    build: ./handshake
    container_name: eitel-node-handshake-producer
    ports:
      - "8090:8080"
    environment:
      - EITEL_NODE_EDC_MANAGEMENT_URL=http://edc-producer-control:11002/api/management
      - EITEL_NODE_EDC_API_KEY=${EITEL_NODE_EDC_API_KEY:-poc-api-key}
      - EITEL_NODE_EDC_DSP_ENDPOINT=http://172.20.10.4:11013/api/protocol/2025-1
      - EITEL_NODE_SESSION_TOKEN_TTL=${EITEL_NODE_SESSION_TOKEN_TTL:-3600}
      - EITEL_NODE_SESSION_TOKEN_SECRET=poc-secret-node-P-change-me
      - EITEL_NODE_COORDINATOR_PUBKEY_JWK_PATH=/keys/coordinator_pubkey.jwk
      - EITEL_NODE_NODE_IDENTITY_DIR=/identity
      - COPYPARTY_URL=http://copyparty:3923
      - COPYPARTY_USER=eitel
      - COPYPARTY_PASSWORD=${COPYPARTY_PASSWORD:-changeme}
    volumes:
      - ./keys:/keys:ro
      - ./identity/producer:/identity:rw
    networks:
      - eitel-producer
      - eitel-shared
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  edc-control:
    image: mariwogr/eitel:v1
    container_name: eitel-node-edc-producer
    ports:
      - "11000:11000"
      - "11002:11002"
      - "11003:11003"
    environment:
      - EDC_PARTICIPANT_ID=producer-connector
      - WEB_HTTP_MANAGEMENT_PORT=11002
      - WEB_HTTP_MANAGEMENT_PATH=/api/management
      - WEB_HTTP_PORT=11000
      - WEB_HTTP_PROTOCOL_PORT=11003
      - WEB_HTTP_PROTOCOL_PATH=/api/protocol
      - EDC_DSP_CALLBACK_ADDRESS=http://172.20.10.4:11003/api/protocol
      - EDC_JDBC_URL=jdbc:postgresql://postgres:5432/edc
      - EDC_JDBC_USER=postgres
      - EDC_JDBC_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - EDC_API_AUTH_KEY=${EDC_API_AUTH_KEY:-poc-api-key}
      - EDC_MANAGEMENT_CONTEXT_ENABLED=true
      - EDC_DATAPLANE_SELECTOR_DEFAULTPLANE=default
      - EDC_DATAPLANE_SELECTOR_DEFAULTPLANE_URL=http://edc-producer-control:11002/api/dataplane  
      - EDC_DATAPLANE_SELECTOR_DEFAULTPLANE_SOURCETYPES=HttpData                                 
      - EDC_DATAPLANE_SELECTOR_DEFAULTPLANE_DESTTYPES=HttpData                                   
      - EDC_DATAPLANE_SELECTOR_DEFAULTPLANE_PUBLICAPIURL=http://edc-producer-control:11002/api/public
      - EDC_PROTOCOL_DSP_HTTP_ENABLED=true
      - EDC_DSP_PROTOCOL_ENABLED=true
    networks:
      eitel-producer:
      eitel-shared:
          aliases:
            - edc-producer-control
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../dataspaceconnector-configuration.properties:/opt/edc/dataspaceconnector-configuration.properties:ro
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: eitel-node-postgres-producer
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=edc
    volumes:
      - postgres_data_producer:/var/lib/postgresql/data
    networks:
      - eitel-producer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  copyparty:
    image: python:3.11-slim
    container_name: eitel-node-copyparty-producer
    ports:
      - "127.0.0.1:3923:3923"
    volumes:
      - copyparty_data_producer:/data
    networks:
      - eitel-producer
      - eitel-shared
    environment:
      - COPYPARTY_PASSWORD=${COPYPARTY_PASSWORD:-changeme}
    command:
      - sh
      - -c
      - "pip install -q copyparty && python3 -m copyparty -p 3923 -v /data:/files:rw,eitel -a eitel:${COPYPARTY_PASSWORD:-changeme} -e2dsa"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3923/').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # eitel-coordinator:
  #   image: eitel/coordinator:latest
  #   build:
  #     context: ../../../EITELCoordinator
  #     dockerfile: Dockerfile
  #   container_name: eitel-node-coordinator-producer
  #   restart: unless-stopped
  #   environment:
  #     COORDINATOR_PRIVATE_KEY_PATH: /keys/coordinator-ed25519-priv.jwk
  #     COORDINATOR_PUBLIC_KEY_PATH: /keys/coordinator-ed25519-pub.jwk
  #     COORDINATOR_TLS_VERIFY_CLIENT: "false"
  #   volumes:
  #     - ./keys:/keys:ro
  #   ports:
  #     - "8000:8000"
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 5s
  #   networks:
  #     - eitel-producer

networks:
  eitel-producer:
    driver: bridge
    internal: false
  eitel-shared:
    external: true
    driver: bridge

volumes:
  copyparty_data_producer:
  postgres_data_producer: